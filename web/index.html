<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작은 친구</title><link rel="stylesheet" href="app.css"></head><body>
<section id="settings" hidden>
<header><div><span class="eyebrow">YOUR DESKTOP COMPANION</span><h1>오늘도, 같이 있을까요?</h1><p>일하는 화면 한쪽에 작은 장난을 더해요.</p></div><span class="version">0.4.2</span></header>
<div class="hero"><img id="heroImage" alt="선택한 친구"><div><span class="badge">● 함께하는 중</span><h2 id="heroName">우사기</h2><p>조용히 자다가, 가끔 빼꼼.</p></div></div>
<div class="section-title"><h3>함께할 친구</h3><span>하나를 골라주세요</span></div><div id="choices" class="choices"></div>
<div class="card"><div class="row"><div><h3>소리</h3><p>고개를 들 때와 춤출 때</p></div><button id="mute" class="toggle" aria-label="음소거 전환"></button></div><div class="range-row"><span>작게</span><input id="volume" aria-label="볼륨" type="range" min="0" max="100"><output id="volumeValue"></output></div></div>
<div class="card"><div class="row"><div><h3>친구 크기</h3><p>화면에 맞게 편안한 크기로</p></div><output id="sizeValue"></output></div><div class="range-row"><span>작게</span><input id="size" aria-label="캐릭터 크기" type="range" min="100" max="280" step="10"><span>크게</span></div></div>
<div class="card"><div class="row"><div><h3>잠깐 쉬기</h3><p>켜두면 친구가 깨지 않아요</p></div><button id="pause" class="toggle" aria-label="일시정지 전환"></button></div><label class="interval">깨어나는 간격<select id="interval"><option value="15">테스트 · 15~30초</option><option value="180">가끔 · 3~6분</option><option value="600">여유롭게 · 10~20분</option></select></label></div>
<div class="actions"><button id="testWake">고개 들기 미리보기</button><button id="testDance">춤 미리보기</button></div><p class="foot">친구를 잡아 옮길 수 있어요. 빈 공간과 춤 화면은 클릭을 통과해요.<br>설정을 닫아도 계속 실행됩니다. 종료: 트레이 메뉴 / Ctrl + Shift + Q</p><p id="status" role="status"></p>
</section>
<div id="pet" hidden><img id="petImage" draggable="false" alt=""><div id="bubble"></div></div><canvas id="dance" hidden></canvas><script src="dance-frames.js"></script><script src="app.js"></script></body></html>
