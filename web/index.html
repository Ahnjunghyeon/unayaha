<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
:root{--cream:#fff8e9;--ink:#352c29;--pink:#ff8391;--yellow:#ffe47a;--sprite:url('./assets/usagi-poses.webp')}
*{box-sizing:border-box}body{margin:0;background:#f0eee8;color:var(--ink);font-family:'Arial Rounded MT Bold','Malgun Gothic',system-ui,sans-serif;overflow:hidden}
.desktop{height:100vh;min-height:560px;position:relative;overflow:hidden;background:linear-gradient(135deg,#e9f0e9,#f6efe3 58%,#e8e2f0)}
.desktop:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 20%,#fff9 0,transparent 32%),radial-gradient(ellipse at 78% 76%,#ffe7bc80,transparent 33%)}
.demo-label{position:absolute;top:24px;left:30px;font-size:13px;letter-spacing:.12em;color:#766b67;z-index:1}.window{position:absolute;left:13%;top:16%;width:min(690px,68vw);height:54vh;min-height:320px;background:#ffffffb8;border:1px solid #fff;border-radius:16px;box-shadow:0 18px 55px #574d3b18;backdrop-filter:blur(8px);z-index:1;overflow:hidden}.titlebar{height:42px;border-bottom:1px solid #e8e2d9;padding:12px 16px;font-size:13px;color:#7f7770}.doc{padding:34px 40px;color:#867d75}.doc h2{font-size:24px;color:#514640;font-weight:400;margin:0 0 22px}.line{height:10px;border-radius:99px;background:#e9e4dc;margin:14px 0;width:75%}.line.short{width:48%}.line.mid{width:62%}.note{position:absolute;bottom:24px;left:28px;color:#807873;font-size:13px;background:#ffffff8a;padding:10px 14px;border-radius:12px;z-index:1}
.character{position:fixed;right:24px;bottom:-18px;width:220px;height:220px;z-index:5;pointer-events:none;filter:drop-shadow(0 8px 2px #75655018);transform-origin:bottom right;transition:transform .3s}.sprite{position:absolute;inset:0;background-image:var(--sprite);background-size:300% 100%;background-position:0% 50%;background-repeat:no-repeat}.character.peeking .sprite{background-position:50% 50%}.character.awake .sprite{background-position:100% 50%}.say{position:absolute;right:155px;bottom:130px;color:var(--ink);background:white;padding:10px 14px;border-radius:15px 15px 3px 15px;box-shadow:0 5px 16px #54483018;font-size:16px;white-space:nowrap;opacity:0;transform:translateY(6px);transition:.2s}.character.pre-wiggle .say,.character.peeking .say,.character.awake .say{opacity:1;transform:none}.character.awake .say{background:#fff1ac}.character.pre-wiggle{animation:dream-wiggle 1.3s ease-in-out 1}@keyframes dream-wiggle{0%,100%{transform:translate(0,0) rotate(0)}18%{transform:translate(-3px,-1px) rotate(-1.4deg)}38%{transform:translate(3px,0) rotate(1.6deg)}60%{transform:translate(-2px,-2px) rotate(-1deg)}80%{transform:translate(2px,0) rotate(.8deg)}}.character.peeking{animation:peek .42s cubic-bezier(.2,.9,.2,1)}@keyframes peek{from{transform:translateY(65px)}to{transform:translateY(0)}}
.overlay{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .25s;background:transparent}.overlay.show{opacity:1}.dancer{position:absolute;width:clamp(112px,16vw,190px);height:clamp(112px,16vw,190px);object-fit:contain;animation:dance .32s ease-in-out infinite alternate;filter:drop-shadow(0 8px 3px #54452a21)}@keyframes dance{from{transform:rotate(-12deg) translateY(5px) scale(.96)}to{transform:rotate(13deg) translateY(-9px) scale(1.05)}}.confetti{position:absolute;inset:0;overflow:hidden}.confetti i{position:absolute;top:-20px;width:10px;height:15px;border-radius:3px;background:var(--pink);animation:fall 1.5s linear infinite}.confetti i:nth-child(3n){background:var(--yellow);animation-duration:1.9s}.confetti i:nth-child(3n + 1){background:#9adbc2;animation-duration:1.25s}@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}.banner{position:absolute;top:11%;left:50%;transform:translateX(-50%) rotate(-3deg);padding:14px 24px;background:#fff;box-shadow:0 7px 0 #ffd978;border-radius:14px;font-size:clamp(20px,4vw,34px);white-space:nowrap;color:#493c32}
.panel{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));background:#fffdf8;border-radius:24px;padding:24px;box-shadow:0 20px 70px #41362630;text-align:center}.panel h1{font-size:26px;margin:2px 0 8px}.panel p{font-size:15px;line-height:1.65;color:#756b64;margin:0 0 18px}.preview{height:104px;position:relative;margin-bottom:12px}.preview .mini{height:120px;width:120px;background-image:var(--sprite);background-size:300% 100%;background-position:0% 50%;position:absolute;left:50%;top:-6px;transform:translateX(-50%);animation:nap 1.6s ease-in-out infinite alternate}@keyframes nap{to{transform:translateX(-50%) rotate(-3deg) translateY(3px)}}button{font:inherit;border:0;border-radius:14px;background:#ffce59;color:#433626;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 #e8ad39}button:active{transform:translateY(2px);box-shadow:0 2px 0 #e8ad39}.secondary{background:#f2eee7;box-shadow:none;color:#675f58}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.settings{position:fixed;right:18px;top:17px;z-index:3;background:#ffffffa8;border:1px solid #fff;border-radius:14px;padding:10px 12px;font-size:13px;color:#70665d}.hud{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:15;background:#433c36;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}.hud.show{opacity:1}.hud strong{color:#ffe47a}.flash{position:fixed;inset:0;z-index:9;background:#ffdf72;opacity:0;pointer-events:none}.flash.pop{animation:flash .3s}@keyframes flash{40%{opacity:.42}}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;color:#77716a;background:#ffffffaa;padding:8px 12px;border-radius:99px;z-index:2;white-space:nowrap}.quiet{position:fixed;left:16px;top:16px;z-index:30;border:0;background:#fff9;padding:8px 11px;border-radius:11px;box-shadow:none;font-size:12px}
body.native-mode{background:transparent!important;color:transparent}body.native-mode .desktop,body.native-mode .panel,body.native-mode .quiet,body.native-mode .hint,body.native-mode .flash,body.native-mode .hud,body.native-mode .banner,body.native-mode .confetti{display:none!important}body.native-mode .character{right:18px;bottom:-12px}
</style>
</head>
<body>
<main class="desktop">
  <div class="demo-label">USAGI DESKTOP BUDDY · INTERACTIVE CONCEPT</div>
  <div class="window"><div class="titlebar">업무 문서 — 주간 보고</div><div class="doc"><h2>이번 주 진행 사항</h2><div class="line"></div><div class="line mid"></div><div class="line short"></div><div class="line"></div><div class="line mid"></div><div class="line short"></div></div></div>
  <div class="note">업무 화면은 데모용 배경입니다. 우사기는 실제 입력을 막지 않습니다.</div>
  <div class="settings">출몰은 랜덤 · 춤은 4초 · 데모에서 직접 테스트 가능</div>
</main>
<button class="quiet" id="quiet">소리 끄기</button>
<div class="character" id="character"><div class="sprite"></div><div class="say" id="say">우나야하야하…</div></div>
<div class="overlay" id="overlay"><div class="confetti" id="confetti"></div><div class="banner" id="banner">들켰다! 우사기 댄스 타임!</div></div>
<div class="flash" id="flash"></div><div class="hud" id="hud"></div><div class="hint" id="hint">데모 시작 후, 우사기가 깨어났을 때 입력하면 들켜요!</div>
<section class="panel" id="panel"><div class="preview"><div class="mini"></div></div><h1>우사기, 냅다 자는 중</h1><p>켜두면 우사기는 우측 하단에서 잡니다.<br>어느 순간 혼자 깨어나 “우나야하야하…” 하고 신호를 보내요.<br>그때 마우스나 키보드를 쓰면… 화면을 확인해 보세요.</p><div class="controls"><button id="start">데모 시작</button><button class="secondary" id="peekNow">깨어나는 장면 보기</button></div></section>
<script>
const character=document.querySelector('#character'), panel=document.querySelector('#panel'), overlay=document.querySelector('#overlay'), hud=document.querySelector('#hud'), flash=document.querySelector('#flash'), hint=document.querySelector('#hint');
let active=false, phase='sleep', timer=null, prepTimeout=null, wakeTimeout=null, danceTimer=null, soundOn=false, audioCtx;
const nativeMode=Boolean(window.__TAURI__?.event);
const DANCE_GIF='./assets/usagi-dance.gif';
const sleepMs=()=>7000+Math.random()*11000;
function chirp(){if(!soundOn)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime;[0,.11,.23,.4].forEach((t,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=i%2?'triangle':'sine';o.frequency.value=[740,940,650,1080][i];g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(.12,now+t+.015);g.gain.exponentialRampToValueAtTime(.0001,now+t+.085);o.connect(g).connect(audioCtx.destination);o.start(now+t);o.stop(now+t+.1)})}catch{}}
function wake(){if(!active||phase!=='sleep')return;phase='preparing';character.className='character pre-wiggle';document.querySelector('#say').textContent='우나..야하야하..';hint.textContent='우사기가 꿈틀거리며 깨어날 준비를 해요…';prepTimeout=setTimeout(()=>{if(phase!=='preparing')return;phase='warning';character.className='character peeking';hint.textContent='우사기가 고개를 들었어요… 지금 움직이면 들켜요!';chirp();wakeTimeout=setTimeout(()=>{if(phase==='warning'){phase='sleep';character.className='character';hint.textContent='휴… 무사히 다시 잠들었어요. 다음은 우사기 마음대로!';setTimeout(()=>{if(active&&phase==='sleep')scheduleWake()},1600)}},5000)},1300)}
function scheduleWake(){clearTimeout(timer);timer=setTimeout(wake,sleepMs())}
function spawnDancers(){const holder=document.querySelector('#confetti');holder.innerHTML='';if(!nativeMode){for(let i=0;i<38;i++){const bit=document.createElement('i');bit.style.left=Math.random()*100+'%';bit.style.animationDelay=(Math.random()*1.5)+'s';bit.style.transform=`rotate(${Math.random()*180}deg)`;holder.appendChild(bit)}}const count=48;for(let i=0;i<count;i++){const d=document.createElement('img');d.className='dancer';d.src=DANCE_GIF;d.style.left=(2+Math.random()*96)+'%';d.style.top=(3+Math.random()*94)+'%';d.style.translate='-50% -50%';const size=112+Math.random()*76;d.style.width=size+'px';d.style.height=size+'px';d.style.animationDelay=(Math.random()*.65)+'s';d.style.zIndex=String(2+Math.floor(Math.random()*4));overlay.appendChild(d)}}
function caught(){if(phase!=='warning')return;clearTimeout(wakeTimeout);phase='dance';character.className='character awake';document.querySelector('#say').textContent='우리링!!!!';overlay.classList.add('show');flash.classList.remove('pop');void flash.offsetWidth;flash.classList.add('pop');spawnDancers();hud.innerHTML='들켰어요! <strong>우사기 댄스 타임</strong>';hud.classList.add('show');hint.textContent='업무 입력은 그대로 동작합니다. 춤은 잠시 후 끝나요.';danceTimer=setTimeout(()=>{overlay.classList.remove('show');overlay.querySelectorAll('.dancer').forEach(x=>x.remove());character.className='character';phase='sleep';hud.classList.remove('show');hint.textContent='우사기는 다시 잠들었어요. 다음 깨어남은 랜덤!';setTimeout(()=>{if(active)scheduleWake()},1700)},4000)}
function activity(){if(phase==='warning')caught()}
document.querySelector('#start').onclick=()=>{panel.hidden=true;active=true;hint.textContent='우사기가 구석에서 자고 있어요. 업무를 계속하세요.';scheduleWake()};
document.querySelector('#peekNow').onclick=()=>{panel.hidden=true;active=true;phase='sleep';wake();};
document.querySelector('#quiet').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'소리 켜짐':'소리 끄기'};
window.addEventListener('pointermove',activity,{passive:true});window.addEventListener('pointerdown',activity,{passive:true});window.addEventListener('keydown',activity,{passive:true});window.addEventListener('wheel',activity,{passive:true});window.addEventListener('touchstart',activity,{passive:true});
if(nativeMode){
  document.body.classList.add('native-mode');
  panel.hidden=true;active=true;
  window.__TAURI__.event.listen('global-activity',activity);
  window.__TAURI__.event.listen('debug-wake',()=>{if(phase==='sleep')wake()});
  hint.textContent='우사기가 바탕화면에서 자고 있어요.';
  setTimeout(wake,6000);
}
</script>
</body>
</html>
